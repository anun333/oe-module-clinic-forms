name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
    - uses: actions/checkout@v4
    - uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php }}
        extensions: dom, zip, gd, mbstring
        coverage: none
    - name: Validate composer.json
      run: composer validate --strict --no-check-lock
    - name: Install dependencies
      run: composer install --no-interaction --no-progress
    - name: Barcode reader, PDF tools and LibreOffice for the scan and PDF/UA tests
      run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends zbar-tools librsvg2-bin poppler-utils libreoffice-writer-nogui fonts-dejavu-core fonts-liberation
    - name: Tests
      run: vendor/bin/phpunit
    - name: FOOTPRINT.md matches the source
      run: php tools/footprint.php --check
    - name: CONFORMANCE.md matches the documents
      run: php tools/conformance.php --check
